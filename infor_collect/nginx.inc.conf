# 可触界面实验室信息收集问卷 —— creaitor.cn /IPED/infor_collect
# include /etc/nginx/iped-infor-collect-locations.inc.conf;
# Node 上游 127.0.0.1:3078

location = /IPED/infor_collect { return 301 /IPED/infor_collect/; }
location = /iped/infor_collect { return 301 /IPED/infor_collect/; }
location /iped/infor_collect/ {
    rewrite ^/iped/infor_collect(/.*)?$ /IPED/infor_collect$1 permanent;
}

location ^~ /IPED/infor_collect/ {
    proxy_pass http://127.0.0.1:3078/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 120s;
    client_max_body_size 50m;
    add_header Cache-Control "private, no-cache";
}
