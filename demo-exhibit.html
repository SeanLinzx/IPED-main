<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="湖湘文化触感档案 demo 演示页面。" />
    <title>Demo | 湖湘文化触感档案</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-progress" aria-hidden="true"></div>
    <div class="tactile-cursor" aria-hidden="true"></div>
    <header class="site-header" data-i18n-attr="aria-label:headerAria">
      <a class="brand" href="./index.html" data-i18n-attr="aria-label:brandAria">
        <span class="brand-mark">TIL</span>
        <span class="brand-copy">
          <span data-i18n="brandCn">可触界面实验室</span>
          <span data-i18n="brandEn">Tangible Interface Lab</span>
        </span>
      </a>
      <nav class="main-nav" data-i18n-attr="aria-label:navAria">
        <a href="./about.html" data-i18n="navAbout">关于</a>
        <a href="./projects.html" data-i18n="navProjects">项目</a>
        <a href="./publications.html" data-i18n="navPublications">出版</a>
        <a href="./join.html" data-i18n="navJoin">加入我们</a>
      </nav>
      <div class="language-switch" role="group" data-i18n-attr="aria-label:languageAria">
        <button type="button" class="lang-button active" data-lang="zh">中文</button>
        <button type="button" class="lang-button" data-lang="en">EN</button>
      </div>
    </header>

    <main>
      <section class="page-hero reveal-item">
        <div>
          <p class="eyebrow" data-i18n="demoKicker">Interactive Demo</p>
          <h1 data-i18n="demoExhibitTitle">互动展陈演示</h1>
        </div>
        <p data-i18n="demoExhibitIntro">切换展陈主题，模拟文化档案的触感叙事。</p>
      </section>

      <section class="content-section demo-stage reveal-item">
        <div class="exhibit-demo">
          <img src="./assets/project-exhibit.svg" alt="互动展陈 demo 背景" />
          <div class="scene-tabs" role="tablist">
            <button class="scene-tab active" data-title-key="scene1Title" data-body-key="scene1Body" data-scene="pattern" data-i18n="scene1Tab">纹样</button>
            <button class="scene-tab" data-title-key="scene2Title" data-body-key="scene2Body" data-scene="object" data-i18n="scene2Tab">器物</button>
            <button class="scene-tab" data-title-key="scene3Title" data-body-key="scene3Body" data-scene="story" data-i18n="scene3Tab">叙事</button>
          </div>
        </div>
        <div class="demo-output">
          <span data-i18n="demoOutputLabel">当前主题</span>
          <h2 data-demo-title data-i18n="scene1Title">纹样触感</h2>
          <p data-demo-body data-i18n="scene1Body">通过凸起纹路和光影变化，把传统纹样转译为可触摸的信息层。</p>
          <a class="ghost-link" href="./projects.html" data-i18n="backProjects">返回项目页</a>
        </div>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
